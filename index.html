<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What are you going to do? · 6학년 9단원</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍁</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" />
  <link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="leaves" aria-hidden="true"></div>
    <h1><span class="en">What are you going to do?</span></h1>
    <p class="subtitle">🍁 6학년 9단원 · 계획 묻고 답하기 · <span class="en">I'm going to ___.</span> 🍂</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="basic" role="tab"><span class="long">🎨 활동 카드 (초급)</span><span class="short">초급 카드</span></button>
    <button class="tab-btn" data-tab="mid" role="tab"><span class="long">🎨 활동 카드 (중급)</span><span class="short">중급 카드</span></button>
    <button class="tab-btn" data-tab="practice" role="tab"><span class="long">🎤 연습하기</span><span class="short">연습하기</span> <span id="plan-count" class="tab-count">0/5</span></button>
  </nav>

  <main>
    <!-- 활동 카드 (초급 · 중급) : app.js 가 같은 구조로 채워요 -->
    <section id="tab-basic" class="tab-panel active" data-level="basic"></section>
    <section id="tab-mid" class="tab-panel" data-level="mid"></section>

    <!-- 🎤 연습하기 -->
    <section id="tab-practice" class="tab-panel">
      <div class="section-block summary-block no-print">
        <h2>🎙️ 연습 기록</h2>
        <div class="summary-stats">
          <span class="stat">🎙️ 총 연습 <b id="sum-count">0</b>회</span>
          <span class="stat">📊 평균 정확도 <b id="sum-avg">-</b></span>
          <span class="stat">✅ 연습한 문장 <b id="sum-done">0/5</b></span>
        </div>
        <div class="summary-actions">
          <button class="btn" id="btn-clear">🧹 기록 지우기</button>
          <button class="btn" id="btn-play-all">🔊 전체 듣기</button>
          <button class="btn" id="btn-print">🖨️ 인쇄하기</button>
        </div>
        <p class="hint" id="mic-support"></p>
      </div>

      <div class="section-block plan-block">
        <h2>📅 나의 계획표 · <span class="en">My Plans</span></h2>
        <p class="hint no-print">활동 카드에서 고른 계획이 여기에 모여요. 줄마다 <b>🎙️ 말하기</b>를 눌러 대답을 말해 보세요.</p>
        <div id="plan-list" class="plan-list"></div>
      </div>
    </section>
  </main>

  <div id="word-pop" class="word-pop" hidden></div>

  <footer class="app-footer no-print">천재(함) 6학년 9단원 · <span class="en">What are you going to do?</span> · 그림: Canva AI</footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
